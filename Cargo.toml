[package]
name = "errorpuller"
version = "0.2.1"
edition = "2021"
rust-version = "1.88"
description = "Evidence-first test and pull-request investigation with illustrated PDF reports"
repository = "https://github.com/qramarq/errorpuller"
license = "AGPL-3.0-only"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sha2 = "0.10"
